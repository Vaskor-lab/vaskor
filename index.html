<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3f5f1"><title>VASKOR kaart</title>
<link rel="preconnect" href="https://unpkg.com" crossorigin><link rel="preconnect" href="https://tiles.openfreemap.org">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.16.0/dist/maplibre-gl.css">
<style>
:root{font:16px system-ui,-apple-system,"Segoe UI",sans-serif;color:#26352f;background:#f3f5f1}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0}#map{position:absolute;inset:0;background:#e9ece7}.bar{position:absolute;z-index:2;top:max(1rem,env(safe-area-inset-top));left:1rem;right:1rem;display:flex;justify-content:space-between;align-items:center;pointer-events:none}.brand,.locate,.status,.search-boundary{background:#ffffffed;box-shadow:0 2px 12px #26332d18;border-radius:.8rem}.brand{margin:0;padding:.7rem .9rem;font-size:.95rem;letter-spacing:.14em}.locate{pointer-events:auto;min-height:48px;padding:.7rem 1rem;border:0;background:#23473e;color:white;font:inherit;font-weight:600;cursor:pointer}.locate:focus-visible{outline:3px solid #d6973d;outline-offset:3px}.locate:disabled{opacity:.7}.search-osm{pointer-events:auto;min-height:48px;padding:.7rem 1rem;border:1px solid #23473e;background:#ffffffed;color:#23473e;border-radius:.8rem;font:inherit;font-weight:600;cursor:pointer}.search-osm:focus-visible{outline:3px solid #d6973d;outline-offset:3px}.search-osm:disabled{opacity:.7}.status{position:absolute;z-index:2;top:calc(max(1rem,env(safe-area-inset-top)) + 4rem);left:1rem;max-width:min(26rem,calc(100vw - 2rem));margin:0;padding:.6rem .8rem;color:#46534e;font-size:.875rem;line-height:1.4}.status:empty{display:none}.search-boundary{position:absolute;z-index:2;left:max(.75rem,env(safe-area-inset-left));bottom:max(.75rem,env(safe-area-inset-bottom));padding:.55rem .75rem;color:#174c42;font-size:.8125rem;font-weight:650;border:1px solid #174c4240}.search-boundary[hidden]{display:none}.maplibregl-popup-content{max-width:min(22rem,calc(100vw - 2rem));max-height:55vh;overflow:auto}.osm-popup h2{margin:0 0 .25rem;font-size:1rem}.osm-popup p{margin:.25rem 0;color:#5a655f;font-size:.8125rem}.osm-popup dl{display:grid;grid-template-columns:minmax(5rem,auto) 1fr;gap:.2rem .6rem;margin:.6rem 0 0;font-size:.8125rem;overflow-wrap:anywhere}.osm-popup dt{font-weight:650}.osm-popup dd{margin:0}.maplibregl-ctrl-bottom-right{right:max(.5rem,env(safe-area-inset-right));bottom:max(.4rem,env(safe-area-inset-bottom))}@media(max-width:420px){.bar{left:.75rem;right:.75rem}.status{left:.75rem;max-width:calc(100vw - 1.5rem)}}
</style>
</head>
<body>
<main aria-label="VASKOR-kaart">
<div id="map" role="region" aria-label="Interactieve kaart" aria-describedby="status"></div>
<header class="bar"><h1 class="brand">VASKOR</h1><div style="display:flex;gap:.5rem;pointer-events:auto"><button class="search-osm" id="search-osm" type="button" aria-describedby="status">Zoek OSM-waterbronnen hier</button><button class="locate" id="locate" type="button" aria-describedby="status">Mijn locatie</button></div></header>
<p class="status" id="status" role="status" aria-live="polite">Kaart laden… Gebruik ‘Mijn locatie’ om de kaart te centreren. Zoek OSM-waterbronnen alleen met de aparte zoekknop.</p>
<div class="search-boundary" id="search-boundary" hidden>Zoekgrens · 40 × 60 km<br>Kandidaten · ongeverifieerde OSM-brondata</div>
</main>
<noscript><p>Schakel JavaScript in om de kaart te gebruiken.</p></noscript>
<script type="module">
const status=document.getElementById("status"),button=document.getElementById("locate"),searchButton=document.getElementById("search-osm"),boundaryLabel=document.getElementById("search-boundary");
const emptyGeoJson={type:"FeatureCollection",features:[]};
const earthRadius=6371008.8,searchHalfWidth=20000,searchHalfHeight=30000;
const overpassEndpoints=["https://overpass-api.de/api/interpreter","https://ovp.dresel.systems/api/interpreter"];
let waterPoints=emptyGeoJson,waterRequest,map;
function searchBounds(longitude,latitude){
 const latitudeDelta=searchHalfHeight/earthRadius*180/Math.PI;
 const longitudeDelta=searchHalfWidth/(earthRadius*Math.max(Math.cos(latitude*Math.PI/180),1e-12))*180/Math.PI;
 return {south:Math.max(-90,latitude-latitudeDelta),west:Math.max(-180,longitude-longitudeDelta),north:Math.min(90,latitude+latitudeDelta),east:Math.min(180,longitude+longitudeDelta)};
}
function boundaryFeature(bounds){
 const {south,west,north,east}=bounds;
 return {type:"FeatureCollection",features:[{type:"Feature",properties:{widthMeters:searchHalfWidth*2,heightMeters:searchHalfHeight*2},geometry:{type:"Polygon",coordinates:[[[west,south],[east,south],[east,north],[west,north],[west,south]]]}}]};
}
async function findWaterPoints(longitude,latitude){
 if(waterRequest?.controller)waterRequest.controller.abort();
 waterPoints=emptyGeoJson;const source=map.getSource("osm-water");if(source)source.setData(waterPoints);
 const {south,west,north,east}=searchBounds(longitude,latitude);
 const query=`[out:json][timeout:45];(nwr["amenity"="drinking_water"](${south},${west},${north},${east});nwr["amenity"="water_point"](${south},${west},${north},${east}););out center;`;
 status.textContent="OpenStreetMap wordt doorzocht binnen de zoekgrens van 40 × 60 km…";
 let data,lastError;
 const request={controller:null};waterRequest=request;
 for(const [endpointIndex,endpoint] of overpassEndpoints.entries()){
  if(endpointIndex)status.textContent="Eerste OpenStreetMap-server reageert niet op tijd; tweede server wordt geprobeerd…";
  const controller=new AbortController();request.controller=controller;
  const timer=setTimeout(()=>controller.abort(),55000);
  try{
   const response=await fetch(endpoint,{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded;charset=UTF-8"},body:new URLSearchParams({data:query}),signal:controller.signal});
   if(!response.ok)throw new Error(`overpass-${response.status}`);
   data=await response.json();
   if(request!==waterRequest)return;
   lastError=null;clearTimeout(timer);break;
  }catch(error){
   clearTimeout(timer);if(request!==waterRequest)return;lastError=error;
  }
 }
 try{
  if(lastError||!data)throw lastError||new Error("overpass-empty-response");
  const features=(data.elements||[]).flatMap(element=>{
   const lon=element.lon??element.center?.lon,lat=element.lat??element.center?.lat;
   if(!Number.isFinite(lon)||!Number.isFinite(lat)||lat<south||lat>north||lon<west||lon>east)return [];
   return [{type:"Feature",geometry:{type:"Point",coordinates:[lon,lat]},properties:{osmType:element.type,osmId:element.id,version:element.version,timestamp:element.timestamp,tags:element.tags||{}}}];
  });
  waterPoints={type:"FeatureCollection",features};
  const pointSource=map.getSource("osm-water");if(pointSource)pointSource.setData(waterPoints);
  status.textContent=features.length?`${features.length} ruwe OSM-kandidaten gevonden binnen de zoekgrens van 40 × 60 km. Dit zijn ongeverifieerde brongegevens; toegankelijkheid, drinkbaarheid, gratis gebruik en openingstijden zijn niet door VASKOR bevestigd.`:"Geen drinkwaterpunten gevonden in OpenStreetMap binnen de zoekgrens van 40 × 60 km. Dit betekent niet dat er ter plaatse geen punten zijn.";
 }catch(error){
  if(request!==waterRequest)return;
  status.textContent=error.name==="AbortError"?"De OpenStreetMap-zoekopdracht duurde te lang op beide servers. Probeer het later opnieuw.":error.message?.startsWith("overpass-")?`OpenStreetMap is tijdelijk niet beschikbaar (HTTP ${error.message.slice(9)}). Probeer het later opnieuw.`:"De OpenStreetMap-gegevens konden niet worden opgehaald. Controleer je verbinding en probeer het opnieuw.";
 }finally{if(waterRequest===request)waterRequest=null;}
}
function showOsmPopup(feature,ml){
 const props=feature.properties,tags=props.tags||{},content=document.createElement("div");content.className="osm-popup";
 const title=document.createElement("h2");title.textContent=tags.name||tags["name:en"]||"Drinkwaterpunt (OSM)";content.append(title);
 const note=document.createElement("p");note.textContent=`OpenStreetMap · ${props.osmType} ${props.osmId} · versie ${props.version??"onbekend"}${props.timestamp?` · OSM-bewerking ${props.timestamp}`:""} · ongetoetste brondata`;content.append(note);
 const list=document.createElement("dl");Object.entries(tags).sort(([a],[b])=>a.localeCompare(b)).forEach(([key,value])=>{const term=document.createElement("dt"),description=document.createElement("dd");term.textContent=key;description.textContent=value;list.append(term,description)});content.append(list);
 const link=document.createElement("a");link.href=`https://www.openstreetmap.org/${encodeURIComponent(props.osmType)}/${props.osmId}`;link.target="_blank";link.rel="noopener noreferrer";link.textContent="Bekijk bronobject";content.append(link);
 new ml.Popup({maxWidth:"none"}).setLngLat(feature.geometry.coordinates).setDOMContent(content).addTo(map);
}
try{
 const ml=await import("https://unpkg.com/maplibre-gl@6.16.0/dist/maplibre-gl.mjs");
 map=new ml.Map({container:"map",style:"https://tiles.openfreemap.org/styles/positron",center:[5.3,52.1],zoom:7,minZoom:3,maxZoom:18,cooperativeGestures:true});
 let marker,searchArea=emptyGeoJson;
 map.once("load",()=>{
  map.addSource("search-boundary",{type:"geojson",data:searchArea});
  map.addLayer({id:"search-boundary-fill",type:"fill",source:"search-boundary",paint:{"fill-color":"#2c8a72","fill-opacity":0.08}});
  map.addLayer({id:"search-boundary-line",type:"line",source:"search-boundary",paint:{"line-color":"#176452","line-width":2,"line-dasharray":[2,1.5]}});
  map.addSource("osm-water",{type:"geojson",data:waterPoints});
  map.addLayer({id:"osm-water-points",type:"circle",source:"osm-water",paint:{"circle-radius":["interpolate",["linear"],["zoom"],5,4,12,7],"circle-color":"#d28735","circle-stroke-color":"#fff","circle-stroke-width":1.5}});
  map.on("click","osm-water-points",event=>{const feature=event.features?.[0];if(feature)showOsmPopup(feature,ml)});
  map.on("mouseenter","osm-water-points",()=>{map.getCanvas().style.cursor="pointer"});map.on("mouseleave","osm-water-points",()=>{map.getCanvas().style.cursor=""});
  status.textContent="Kaart klaar. ‘Mijn locatie’ centreert de kaart; zoek OSM-waterbronnen apart wanneer je dat wilt.";
 });
 map.on("error",()=>{status.textContent="Kaartgegevens zijn niet volledig beschikbaar. Controleer je verbinding; je kunt de pagina later opnieuw proberen."});
 button.addEventListener("click",()=>{
  if(!navigator.geolocation){status.textContent="Locatiebepaling is niet beschikbaar in deze browser.";return}
  button.disabled=true;status.textContent="Locatietoestemming wordt gevraagd…";
  navigator.geolocation.getCurrentPosition(({coords})=>{
   const point=[coords.longitude,coords.latitude];
   if(!Number.isFinite(point[0])||!Number.isFinite(point[1])||point[0]<-180||point[0]>180||point[1]<-90||point[1]>90){
    status.textContent="Je locatie kon niet worden bepaald. Controleer de locatievoorzieningen en probeer opnieuw.";button.disabled=false;return;
   }
   if(!marker)marker=new ml.Marker({color:"#23473e"}).setLngLat(point).addTo(map);else marker.setLngLat(point);
   const bounds=searchBounds(point[0],point[1]);
   searchArea=boundaryFeature(bounds);
   const source=map.getSource("search-boundary");if(source)source.setData(searchArea);
   boundaryLabel.hidden=false;
   map.fitBounds([[bounds.west,bounds.south],[bounds.east,bounds.north]],{padding:{top:128,right:48,bottom:72,left:48},maxZoom:8,duration:800});
   button.disabled=false;
  },error=>{
   status.textContent=({1:"Geen toegang tot je locatie. De kaart blijft bruikbaar.",2:"Je locatie kon niet worden bepaald. Controleer de locatievoorzieningen en probeer opnieuw.",3:"Locatie bepalen duurde te lang. Probeer opnieuw."})[error.code]||"Locatiebepaling is niet gelukt. De kaart blijft bruikbaar.";
   button.disabled=false;
  },{enableHighAccuracy:true,timeout:20000,maximumAge:0});
 });
 searchButton.addEventListener("click",()=>{const center=map.getCenter();findWaterPoints(center.lng,center.lat)});
}catch{
 status.textContent="De kaartmodule kon niet worden geladen. Controleer je verbinding; je locatie is niet opgevraagd.";
 button.addEventListener("click",()=>{status.textContent="De kaart is niet beschikbaar. Probeer de pagina opnieuw wanneer je verbinding hebt."});
 searchButton.addEventListener("click",()=>{status.textContent="De kaart is niet beschikbaar. Probeer de pagina opnieuw wanneer je verbinding hebt."});
}
</script>
</body>
</html>
