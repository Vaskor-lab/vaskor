<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3f5f1"><title>Kaart</title>
<link rel="preconnect" href="https://unpkg.com" crossorigin><link rel="preconnect" href="https://tiles.openfreemap.org">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.16.0/dist/maplibre-gl.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:FILL@1&display=block">
<style>
:root{font:16px system-ui,-apple-system,"Segoe UI",sans-serif;color:#26352f;background:#f3f5f1}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0}#map{position:absolute;inset:0;background:#e9ece7;touch-action:none}.bar{position:absolute;z-index:2;top:max(.75rem,env(safe-area-inset-top));left:.75rem;right:.75rem;display:flex;justify-content:flex-end;align-items:center;pointer-events:none}.locate{pointer-events:auto;display:flex;align-items:center;justify-content:space-between;gap:.75rem;min-width:146px;min-height:56px;padding:.45rem .6rem .45rem .9rem;border:2px solid #23473e;background:#fff;color:#23473e;font:inherit;font-weight:650;cursor:pointer;touch-action:manipulation}.locate[aria-checked="true"]{background:#fff}.locate:focus-visible{outline:3px solid #d6973d;outline-offset:3px}.locate:disabled{opacity:.7}.locate .switch-track{position:relative;width:48px;height:30px;flex:none;border-radius:20px;background:#747d78;transition:background .16s}.locate .switch-track:after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:white;box-shadow:0 1px 3px #0005;transition:transform .16s}.locate[aria-checked="true"] .switch-track{background:#167453}.locate[aria-checked="true"] .switch-track:after{transform:translateX(18px)}.switch-state{font-size:.75rem;font-weight:750}.search-osm{pointer-events:auto;min-height:56px;padding:.7rem 1rem;border:1px solid #23473e;background:#ffffffed;color:#23473e;border-radius:.8rem;font:inherit;font-weight:600;cursor:pointer;touch-action:manipulation}.search-osm:focus-visible{outline:3px solid #d6973d;outline-offset:3px}.search-osm:disabled{opacity:.7}.status{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}.status:empty{display:none}.maplibregl-popup-content{max-width:min(22rem,calc(100vw - 2rem));max-height:55vh;overflow:auto}.osm-popup h2{margin:0 0 .25rem;font-size:1rem}.osm-popup p{margin:.25rem 0;color:#5a655f;font-size:.8125rem}.osm-popup dl{display:grid;grid-template-columns:minmax(5rem,auto) 1fr;gap:.2rem .6rem;margin:.6rem 0 0;font-size:.8125rem;overflow-wrap:anywhere}.osm-popup dt{font-weight:650}.osm-popup dd{margin:0}.maplibregl-ctrl-bottom-right{right:max(.35rem,env(safe-area-inset-right));bottom:max(.25rem,env(safe-area-inset-bottom));font-size:9px!important;line-height:1.2}.maplibregl-ctrl-attrib{font-size:9px!important;line-height:1.2!important}.maplibregl-ctrl-attrib a{color:#34423c!important}@media(max-width:520px){.bar{left:.5rem;right:.5rem;gap:.45rem}.locate,.search-osm{min-height:54px;padding:.55rem .65rem;font-size:.86rem}.radius-control{min-height:54px!important}.maplibregl-ctrl-bottom-right{font-size:8px!important}.maplibregl-ctrl-attrib{font-size:8px!important}}
.user-location{width:42px;height:42px;position:relative;display:grid;place-items:center;pointer-events:none}.user-location .heading{position:absolute;inset:0;transform-origin:50% 50%;display:none}.user-location.has-heading .heading{display:block}.user-location .heading:before{content:"";position:absolute;left:8px;top:-4px;width:26px;height:29px;background:#2b83eacc;clip-path:polygon(50% 0,100% 100%,50% 80%,0 100%)}.user-location .dot{position:relative;z-index:1;width:16px;height:16px;border:3px solid #fff;border-radius:50%;background:#1683e8;box-shadow:0 1px 5px #153d5d88}
</style>
<style>
.radius-control{pointer-events:auto;display:flex;align-items:center;gap:.2rem;min-height:44px;padding:.3rem .45rem;border:1px solid #23473e;border-radius:.7rem;background:#ffffffed;color:#23473e;font-size:.8rem;font-weight:600;white-space:nowrap}.radius-control select{max-width:4.5rem;border:0;background:transparent;color:inherit;font:inherit;font-weight:700}@media(max-width:520px){.radius-control{min-height:40px;padding:.2rem .3rem;font-size:.7rem}.radius-control select{max-width:3.5rem}}
.poi-marker{display:block;width:40px;height:48px;padding:0;border:0;background:transparent;cursor:pointer;filter:drop-shadow(0 2px 2px #20313a35)}.poi-marker svg{display:block;width:40px;height:48px}.poi-marker:focus-visible{outline:3px solid #243d4a;outline-offset:2px;border-radius:50%}

</style>
</head>
<body>
<main aria-label="Kaart">
<div id="map" role="region" aria-label="Interactieve kaart" aria-describedby="status"></div>
<header class="bar"><div style="display:flex;gap:.5rem;align-items:center;pointer-events:auto"><label class="radius-control" for="search-radius">Straal <select id="search-radius" aria-label="Zoekstraal"><option value="20" selected>20 km</option><option value="50">50 km</option></select></label><button class="search-osm" id="search-osm" type="button" aria-describedby="status">Zoek voorzieningen</button><button class="locate" id="locate" type="button" role="switch" aria-checked="false" aria-label="Locatie uit" aria-describedby="status"><span>Locatie</span><span class="switch-state">UIT</span><span class="switch-track" aria-hidden="true"></span></button></div></header>
<p class="status" id="status" role="status" aria-live="polite">Kaart laden…</p>

</main>
<noscript><p>Schakel JavaScript in om de kaart te gebruiken.</p></noscript>
<script type="module">
import {DEFAULT_RADIUS_KM,isInsideSearchArea,overpassSearchQuery,searchBoundary} from "./knowledge/search-area.mjs";
import {categoryLabel,toVaskorFeature} from "./knowledge/osm-discovery.mjs";
import {filterGratisOsmElements,gratisRelationForOsmElement} from "./knowledge/gratis-filter.mjs";
import {createPoiMarkerElement} from "./knowledge/map-markers.mjs";
import {applyVaskorMapStyle} from "./knowledge/map-style.mjs";
import {fetchOverpass} from "./knowledge/overpass-client.mjs";
const status=document.getElementById("status"),button=document.getElementById("locate"),searchButton=document.getElementById("search-osm"),radiusSelect=document.getElementById("search-radius");
const emptyGeoJson={type:"FeatureCollection",features:[]};
const overpassEndpoints=["https://overpass-api.de/api/interpreter","https://ovp.dresel.systems/api/interpreter"];
let waterPoints=emptyGeoJson,waterRequest,map,ml,poiMarkers=[],followWatchId=null,currentOrigin=null,locationMarker=null,deviceHeading=null,headingListening=false;
let searchRadiusKm=DEFAULT_RADIUS_KM;
function circleFeature(point,radius){const coords=Array.from({length:65},(_,i)=>{const b=2*Math.PI*i/64,d=radius/6371008.8,lat1=point[1]*Math.PI/180,lon1=point[0]*Math.PI/180,lat=Math.asin(Math.sin(lat1)*Math.cos(d)+Math.cos(lat1)*Math.sin(d)*Math.cos(b)),lon=lon1+Math.atan2(Math.sin(b)*Math.sin(d)*Math.cos(lat1),Math.cos(d)-Math.sin(lat1)*Math.sin(lat));return [((lon*180/Math.PI+540)%360)-180,lat*180/Math.PI]});return {type:"Feature",geometry:{type:"Polygon",coordinates:[coords]},properties:{}}}
function setLocationMarker(coords){const point=[coords.longitude,coords.latitude];if(!locationMarker){const el=document.createElement("div");el.className="user-location";el.setAttribute("aria-label","Locatie");el.innerHTML='<span class="heading"></span><span class="dot"></span>';locationMarker=new ml.Marker({element:el,anchor:"center",rotationAlignment:"viewport"}).setLngLat(point).addTo(map)}else locationMarker.setLngLat(point);const heading=Number.isFinite(coords.heading)&&coords.heading>=0&&(coords.speed==null||coords.speed>.5)?coords.heading:deviceHeading,el=locationMarker.getElement();if(Number.isFinite(heading)){el.classList.add("has-heading");el.querySelector(".heading").style.transform=`rotate(${heading}deg)`}else el.classList.remove("has-heading");const accuracy=map.getSource("location-accuracy");if(accuracy)accuracy.setData(Number.isFinite(coords.accuracy)&&coords.accuracy>0?{type:"FeatureCollection",features:[circleFeature(point,coords.accuracy)]}:emptyGeoJson)}
function setLocationSwitch(on){button.setAttribute("aria-checked",String(on));button.setAttribute("aria-label",`Locatie ${on?"aan":"uit"}`);button.querySelector(".switch-state").textContent=on?"AAN":"UIT"}
function orientationHandler(event){if(event.absolute!==true||!Number.isFinite(event.alpha))return;const screenAngle=screen.orientation?.angle??window.orientation??0;deviceHeading=(360-event.alpha+screenAngle)%360;if(locationMarker){const el=locationMarker.getElement();el.classList.add("has-heading");el.querySelector(".heading").style.transform=`rotate(${deviceHeading}deg)`}}
async function enableHeading(){const Orientation=window.DeviceOrientationEvent;if(!Orientation)return;if(typeof Orientation.requestPermission==="function"){try{if(await Orientation.requestPermission()!=="granted")return}catch{return}}if(button.getAttribute("aria-checked")!=="true")return;if("ondeviceorientationabsolute" in window)window.addEventListener("deviceorientationabsolute",orientationHandler);else window.addEventListener("deviceorientation",orientationHandler);headingListening=true}
function updateBoundary(){if(!currentOrigin)return;const area=searchBoundary(currentOrigin[0],currentOrigin[1],searchRadiusKm),source=map?.getSource("search-boundary");if(source)source.setData(area)}
function clearPoiMarkers(){poiMarkers.forEach(marker=>marker.remove());poiMarkers=[]}
function renderPoiMarkers(){clearPoiMarkers();waterPoints.features.forEach(feature=>{const element=createPoiMarkerElement(feature,document);element.addEventListener("click",event=>{event.preventDefault();showOsmPopup(feature,ml)});poiMarkers.push(new ml.Marker({element,anchor:"bottom"}).setLngLat(feature.geometry.coordinates).addTo(map))})}
 radiusSelect.addEventListener("change",()=>{searchRadiusKm=Number(radiusSelect.value);if(waterRequest?.controller)waterRequest.controller.abort();waterRequest=null;waterPoints=emptyGeoJson;clearPoiMarkers();updateBoundary();if(currentOrigin)status.textContent=`Zoekstraal ingesteld op ${searchRadiusKm} km. Tik op ‘Zoek voorzieningen’ om opnieuw te zoeken.`});
async function findWaterPoints(longitude,latitude){
 const requestedRadiusKm=searchRadiusKm;
 waterRequest?.controller.abort();
 waterPoints=emptyGeoJson;clearPoiMarkers();
 const request={controller:new AbortController()};waterRequest=request;
  let waterOutcome="voorzieningen zoeken…";
 const renderStatus=()=>{if(request===waterRequest)status.textContent=waterOutcome};renderStatus();
 const describeError=error=>error.kind==="http"?`HTTP ${error.detail} bij ${error.endpoint}`:error.kind==="timeout"?`timeout bij ${error.endpoint}`:error.kind==="json"?`ongeldige JSON van ${error.endpoint}`:error.kind==="cancelled"?"geannuleerd":`netwerk/CORS-fout bij ${error.endpoint}`;
 const waterTask=(async()=>{
  try{
   const {data}=await fetchOverpass(overpassSearchQuery(longitude,latitude,requestedRadiusKm),{endpoints:overpassEndpoints,signal:request.controller.signal,timeoutMs:70000});
   if(request!==waterRequest)return;
   const features=filterGratisOsmElements(data.elements||[]).flatMap(element=>{
    const lon=element.lon??element.center?.lon,lat=element.lat??element.center?.lat;
    if(!Number.isFinite(lon)||!Number.isFinite(lat)||!isInsideSearchArea(longitude,latitude,lon,lat,requestedRadiusKm))return [];
    const feature=toVaskorFeature(element);if(feature)feature.properties.gratisRelation=gratisRelationForOsmElement(element);return feature?[feature]:[];
   });
   waterPoints={type:"FeatureCollection",features};renderPoiMarkers();
   waterOutcome="Voorzieningen op de kaart bijgewerkt.";
  }catch(error){if(request!==waterRequest||error.kind==="cancelled")return;waterOutcome=`Voorzieningen mislukt: ${describeError(error)}.`}
  renderStatus();
 })();
 currentOrigin=[longitude,latitude];updateBoundary();
 await waterTask;
 if(request===waterRequest){waterRequest=null;searchButton.disabled=false}
}
function showOsmPopup(feature,ml){
 const props=feature.properties,tags=props.tags||{},content=document.createElement("div");content.className="osm-popup";
 const category=props.category||"water",label=categoryLabel(category);
 const title=document.createElement("h2");title.textContent=tags.name||tags["name:en"]||props.catalogLabel||label;content.append(title);
 const list=document.createElement("dl");Object.entries(tags).sort(([a],[b])=>a.localeCompare(b)).forEach(([key,value])=>{const term=document.createElement("dt"),description=document.createElement("dd");term.textContent=key;description.textContent=value;list.append(term,description)});content.append(list);
 new ml.Popup({maxWidth:"none"}).setLngLat(feature.geometry.coordinates).setDOMContent(content).addTo(map);
}
try{
 ml=await import("https://unpkg.com/maplibre-gl@6.16.0/dist/maplibre-gl.mjs");
 map=new ml.Map({container:"map",style:"https://tiles.openfreemap.org/styles/positron",center:[5.3,52.1],zoom:7,minZoom:3,maxZoom:18,cooperativeGestures:false,attributionControl:{compact:false}});
  let searchArea=emptyGeoJson;
 map.once("load",()=>{
  applyVaskorMapStyle(map);
  map.addSource("search-boundary",{type:"geojson",data:searchArea});
  map.addLayer({id:"search-boundary-fill",type:"fill",source:"search-boundary",paint:{"fill-color":"#2c8a72","fill-opacity":0.08}});
  map.addLayer({id:"search-boundary-line",type:"line",source:"search-boundary",paint:{"line-color":"#176452","line-width":2,"line-dasharray":[2,1.5]}});
  map.addSource("location-accuracy",{type:"geojson",data:emptyGeoJson});
  map.addLayer({id:"location-accuracy-fill",type:"fill",source:"location-accuracy",paint:{"fill-color":"#2583df","fill-opacity":0.12}});
  map.addLayer({id:"location-accuracy-line",type:"line",source:"location-accuracy",paint:{"line-color":"#2583df","line-opacity":0.35,"line-width":1}});
  status.textContent="Kaart klaar.";
 });
 map.on("error",()=>{status.textContent="Kaartgegevens zijn niet volledig beschikbaar. Controleer je verbinding; je kunt de pagina later opnieuw proberen."});
 const updatePosition=({coords})=>{
   const point=[coords.longitude,coords.latitude];
   if(!Number.isFinite(point[0])||!Number.isFinite(point[1])||point[0]<-180||point[0]>180||point[1]<-90||point[1]>90)return;
   setLocationMarker(coords);
   currentOrigin=point;updateBoundary();
 };
 button.addEventListener("click",()=>{
  if(followWatchId!==null){navigator.geolocation.clearWatch(followWatchId);followWatchId=null;setLocationSwitch(false);if(headingListening){window.removeEventListener("deviceorientationabsolute",orientationHandler);window.removeEventListener("deviceorientation",orientationHandler);headingListening=false}deviceHeading=null;if(locationMarker){locationMarker.remove();locationMarker=null}map.getSource("location-accuracy")?.setData(emptyGeoJson);status.textContent="Locatie is uitgeschakeld.";return}
  if(!navigator.geolocation){status.textContent="Locatiebepaling is niet beschikbaar in deze browser.";return}
  setLocationSwitch(true);enableHeading();status.textContent="Locatietoestemming wordt gevraagd…";
  let firstFix=true;
  followWatchId=navigator.geolocation.watchPosition(position=>{if(followWatchId===null)return;const {coords}=position,point=[coords.longitude,coords.latitude];if(!Number.isFinite(point[0])||!Number.isFinite(point[1])||point[0]<-180||point[0]>180||point[1]<-90||point[1]>90)return;updatePosition(position);if(firstFix){map.easeTo({center:point,zoom:7,duration:800});firstFix=false}status.textContent="Locatie is ingeschakeld."},error=>{if(followWatchId!==null)navigator.geolocation.clearWatch(followWatchId);followWatchId=null;setLocationSwitch(false);if(headingListening){window.removeEventListener("deviceorientationabsolute",orientationHandler);window.removeEventListener("deviceorientation",orientationHandler);headingListening=false}deviceHeading=null;if(locationMarker){locationMarker.remove();locationMarker=null}map.getSource("location-accuracy")?.setData(emptyGeoJson);status.textContent=error.code===1?"Geen toegang tot je locatie.":"Locatie bepalen is niet gelukt."},{enableHighAccuracy:true,timeout:20000,maximumAge:0});
 });
 searchButton.addEventListener("click",()=>{
  if(button.getAttribute("aria-checked")!=="true"){status.textContent="Schakel Locatie in om voorzieningen te zoeken.";return}
  if(!navigator.geolocation){status.textContent="Locatiebepaling is niet beschikbaar. Zoeken vereist je actuele GPS-locatie; er is geen zoekactie uitgevoerd.";return}
  searchButton.disabled=true;status.textContent="Actuele GPS-locatie wordt opgevraagd voor de zoekactie…";
  navigator.geolocation.getCurrentPosition(({coords})=>{
   const point=[coords.longitude,coords.latitude];
   if(!Number.isFinite(point[0])||!Number.isFinite(point[1])||point[0]<-180||point[0]>180||point[1]<-90||point[1]>90){status.textContent="Je actuele locatie kon niet worden bepaald. Er is niet gezocht; probeer opnieuw.";searchButton.disabled=false;return}
   setLocationMarker(coords);
   currentOrigin=point;updateBoundary();
   map.easeTo({center:point,zoom:7,duration:800});
   findWaterPoints(point[0],point[1]).finally(()=>{searchButton.disabled=false});
  },error=>{
   status.textContent=({1:"Geen toegang tot je actuele locatie. Er is niet gezocht.",2:"Je actuele locatie kon niet worden bepaald. Er is niet gezocht; controleer je locatievoorzieningen.",3:"Actuele locatie bepalen duurde te lang. Er is niet gezocht; probeer opnieuw."})[error.code]||"Locatiebepaling is niet gelukt. Er is niet gezocht.";
   searchButton.disabled=false;
  },{enableHighAccuracy:true,timeout:60000,maximumAge:0});
 });
}catch{
 status.textContent="De kaartmodule kon niet worden geladen. Controleer je verbinding; je locatie is niet opgevraagd.";
 button.addEventListener("click",()=>{status.textContent="De kaart is niet beschikbaar. Probeer de pagina opnieuw wanneer je verbinding hebt."});
 searchButton.addEventListener("click",()=>{status.textContent="De kaart is niet beschikbaar. Probeer de pagina opnieuw wanneer je verbinding hebt."});
}
</script>
</body>
</html>
