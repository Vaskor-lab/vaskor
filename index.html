<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3f5f1"><title>VASKOR kaart</title>
<link rel="preconnect" href="https://unpkg.com" crossorigin><link rel="preconnect" href="https://tiles.openfreemap.org">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.16.0/dist/maplibre-gl.css">
<style>
:root{font:16px system-ui,-apple-system,"Segoe UI",sans-serif;color:#26352f;background:#f3f5f1}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0}#map{position:absolute;inset:0;background:#e9ece7}.bar{position:absolute;z-index:2;top:max(1rem,env(safe-area-inset-top));left:1rem;right:1rem;display:flex;justify-content:space-between;align-items:center;pointer-events:none}.brand,.locate,.status,.search-boundary{background:#ffffffed;box-shadow:0 2px 12px #26332d18;border-radius:.8rem}.brand{margin:0;padding:.7rem .9rem;font-size:.95rem;letter-spacing:.14em}.locate{pointer-events:auto;min-height:48px;padding:.7rem 1rem;border:0;background:#23473e;color:white;font:inherit;font-weight:600;cursor:pointer}.locate:focus-visible{outline:3px solid #d6973d;outline-offset:3px}.locate:disabled{opacity:.7}.search-osm{pointer-events:auto;min-height:48px;padding:.7rem 1rem;border:1px solid #23473e;background:#ffffffed;color:#23473e;border-radius:.8rem;font:inherit;font-weight:600;cursor:pointer}.search-osm:focus-visible{outline:3px solid #d6973d;outline-offset:3px}.search-osm:disabled{opacity:.7}.status{position:absolute;z-index:2;top:calc(max(1rem,env(safe-area-inset-top)) + 4rem);left:1rem;max-width:min(26rem,calc(100vw - 2rem));margin:0;padding:.6rem .8rem;color:#46534e;font-size:.875rem;line-height:1.4}.status:empty{display:none}.search-boundary{position:absolute;z-index:2;left:max(.75rem,env(safe-area-inset-left));bottom:max(.75rem,env(safe-area-inset-bottom));padding:.55rem .75rem;color:#174c42;font-size:.8125rem;font-weight:650;border:1px solid #174c4240}.search-boundary[hidden]{display:none}.panel-heading{display:flex;align-items:flex-start;gap:.4rem}.panel-copy{flex:1}.panel-toggle{flex:none;width:2rem;height:2rem;padding:0;border:1px solid #23473e40;border-radius:.55rem;background:#fff;color:#23473e;font:inherit;font-size:1rem;font-weight:700;line-height:1;cursor:pointer}.panel-toggle:focus-visible{outline:3px solid #d6973d;outline-offset:2px}.collapsible-panel.collapsed .panel-copy{display:none}.collapsible-panel.collapsed{padding:.25rem}.maplibregl-popup-content{max-width:min(22rem,calc(100vw - 2rem));max-height:55vh;overflow:auto}.osm-popup h2{margin:0 0 .25rem;font-size:1rem}.osm-popup p{margin:.25rem 0;color:#5a655f;font-size:.8125rem}.osm-popup dl{display:grid;grid-template-columns:minmax(5rem,auto) 1fr;gap:.2rem .6rem;margin:.6rem 0 0;font-size:.8125rem;overflow-wrap:anywhere}.osm-popup dt{font-weight:650}.osm-popup dd{margin:0}.maplibregl-ctrl-bottom-right{right:max(.5rem,env(safe-area-inset-right));bottom:max(.4rem,env(safe-area-inset-bottom))}@media(max-width:420px){.bar{left:.75rem;right:.75rem}.status{left:.75rem;max-width:calc(100vw - 1.5rem)}}
#export-data{position:absolute;z-index:2;left:max(.75rem,env(safe-area-inset-left));bottom:calc(max(.75rem,env(safe-area-inset-bottom)) + 3.7rem);min-height:46px;padding:.55rem .75rem;border:1px solid #23473e;border-radius:.8rem;background:#ffffffed;color:#23473e;font:inherit;font-weight:600;box-shadow:0 2px 12px #26332d18}.capture{display:block;width:100%;margin-top:.75rem;min-height:44px;padding:.6rem .75rem;border:0;border-radius:.6rem;background:#23473e;color:white;font:inherit;font-weight:600;cursor:pointer}@media(max-width:520px){.brand{padding:.6rem;font-size:.8rem}.search-osm,.locate{min-height:44px;padding:.55rem .6rem;font-size:.78rem}}
</style>
<style>
.radius-control{pointer-events:auto;display:flex;align-items:center;gap:.2rem;min-height:44px;padding:.3rem .45rem;border:1px solid #23473e;border-radius:.7rem;background:#ffffffed;color:#23473e;font-size:.8rem;font-weight:600;white-space:nowrap}.radius-control select{max-width:4.5rem;border:0;background:transparent;color:inherit;font:inherit;font-weight:700}.relation-panel{margin:.6rem 0;padding:.55rem;border-radius:.5rem;background:#f3f5f1;font-size:.8125rem}.relation-panel h3{margin:.1rem 0;font-size:.85rem}.relation-panel ul{margin:.2rem 0 .5rem;padding-left:1.1rem}.relation-panel li{margin:.15rem 0}@media(max-width:520px){.radius-control{min-height:40px;padding:.2rem .3rem;font-size:.7rem}.radius-control select{max-width:3.5rem}}
</style>
</head>
<body>
<main aria-label="VASKOR-kaart">
<div id="map" role="region" aria-label="Interactieve kaart" aria-describedby="status"></div>
<header class="bar"><h1 class="brand">VASKOR</h1><div style="display:flex;gap:.5rem;pointer-events:auto"><label class="radius-control" for="search-radius">Straal <select id="search-radius" aria-label="Zoekstraal"><option value="20" selected>20 km</option><option value="50">50 km</option></select></label><button class="search-osm" id="search-osm" type="button" aria-describedby="status">Zoek voorzieningen</button><button class="locate" id="locate" type="button" aria-describedby="status">Mijn locatie</button></div></header>
<div class="status collapsible-panel" id="status-panel"><div class="panel-heading"><span class="panel-copy" id="status" role="status" aria-live="polite">Kaart laden… Gebruik ‘Mijn locatie’ om de kaart te centreren. Voorzieningen zoeken gebeurt alleen wanneer je dat kiest.</span><button class="panel-toggle" type="button" aria-label="Statuspaneel inklappen" aria-expanded="true">⌃</button></div></div>
<div class="search-boundary collapsible-panel" id="search-boundary" hidden><div class="panel-heading"><span class="panel-copy" id="search-boundary-copy">Zoekcirkel · 20 km vanaf GPS · OSM-kandidaten niet geverifieerd</span><button class="panel-toggle" type="button" aria-label="Zoekgebiedlabel inklappen" aria-expanded="true">⌃</button></div></div>
<button id="export-data" type="button" aria-describedby="status">Exporteer veldtest · 0</button>
</main>
<noscript><p>Schakel JavaScript in om de kaart te gebruiken.</p></noscript>
<script type="module">
import {emptyPilotDataset,saveFieldObservation} from "./knowledge/pilot.mjs";
import {DEFAULT_RADIUS_KM,isInsideSearchArea,overpassSearchQuery,searchBoundary,distanceMeters} from "./knowledge/search-area.mjs";
import {categoryLabel,relationsForFeature,toVaskorFeature} from "./knowledge/osm-discovery.mjs";
const status=document.getElementById("status"),button=document.getElementById("locate"),searchButton=document.getElementById("search-osm"),radiusSelect=document.getElementById("search-radius"),boundaryLabel=document.getElementById("search-boundary"),boundaryCopy=document.getElementById("search-boundary-copy"),exportButton=document.getElementById("export-data");
document.querySelectorAll(".panel-toggle").forEach(toggle=>toggle.addEventListener("click",()=>{
 const panel=toggle.closest(".collapsible-panel"),collapsed=panel.classList.toggle("collapsed");
 toggle.setAttribute("aria-expanded",String(!collapsed));
 toggle.setAttribute("aria-label",`${panel.id==="status-panel"?"Statuspaneel":"Zoekgebiedlabel"} ${collapsed?"uitklappen":"inklappen"}`);
 toggle.textContent=collapsed?"⌄":"⌃";
}));
const emptyGeoJson={type:"FeatureCollection",features:[]};
const overpassEndpoints=["https://overpass-api.de/api/interpreter","https://ovp.dresel.systems/api/interpreter"];
let waterPoints=emptyGeoJson,waterRequest,map,followWatchId=null,currentOrigin=null;
let searchRadiusKm=DEFAULT_RADIUS_KM;
const pilotKey="vaskor-knowledge-pilot-v1";
let pilotData;try{const stored=JSON.parse(localStorage.getItem(pilotKey));pilotData=stored?.model_version==="1.0"?stored:emptyPilotDataset()}catch{pilotData=emptyPilotDataset()}
const updateExportLabel=()=>{exportButton.textContent=`Exporteer veldtest · ${pilotData.knowledge_objects.length}`};updateExportLabel();

function updateBoundaryLabel(){boundaryCopy.textContent=`Zoekcirkel · ${searchRadiusKm} km vanaf GPS · water, toiletten, douches en openbare zwemplekken · OSM-kandidaten niet geverifieerd`}
function updateBoundary(){if(!currentOrigin)return;const area=searchBoundary(currentOrigin[0],currentOrigin[1],searchRadiusKm),source=map?.getSource("search-boundary");if(source)source.setData(area);boundaryLabel.hidden=false;updateBoundaryLabel()}
radiusSelect.addEventListener("change",()=>{searchRadiusKm=Number(radiusSelect.value);if(waterRequest?.controller)waterRequest.controller.abort();waterRequest=null;waterPoints=emptyGeoJson;map?.getSource("osm-water")?.setData(waterPoints);updateBoundary();if(currentOrigin)status.textContent=`Zoekstraal ingesteld op ${searchRadiusKm} km. Tik op ‘Zoek voorzieningen’ om opnieuw te zoeken.`});
async function findWaterPoints(longitude,latitude){
 const requestedRadiusKm=searchRadiusKm;
 if(waterRequest?.controller)waterRequest.controller.abort();
 waterPoints=emptyGeoJson;const source=map.getSource("osm-water");if(source)source.setData(waterPoints);
 const query=overpassSearchQuery(longitude,latitude,requestedRadiusKm);
 status.textContent=`Actuele GPS-locatie vastgelegd. OpenStreetMap wordt binnen ${requestedRadiusKm} km doorzocht…`;
 let data,lastError;
 const request={controller:null};waterRequest=request;
 for(const [endpointIndex,endpoint] of overpassEndpoints.entries()){
  const controller=new AbortController();request.controller=controller;
  const timer=setTimeout(()=>controller.abort(),15000);
  try{
   const response=await fetch(endpoint,{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded;charset=UTF-8"},body:new URLSearchParams({data:query}),signal:controller.signal});
   if(!response.ok)throw new Error(`overpass-${response.status}`);
   data=await response.json();
   if(request!==waterRequest)return;
   lastError=null;clearTimeout(timer);break;
  }catch(error){
   clearTimeout(timer);if(request!==waterRequest)return;lastError=error;
  }
 }
 try{
  if(lastError||!data)throw lastError||new Error("overpass-empty-response");
  const features=(data.elements||[]).flatMap(element=>{
   const lon=element.lon??element.center?.lon,lat=element.lat??element.center?.lat;
   if(!Number.isFinite(lon)||!Number.isFinite(lat)||!isInsideSearchArea(longitude,latitude,lon,lat,requestedRadiusKm))return [];
   const feature=toVaskorFeature(element);return feature?[feature]:[];
  });
  waterPoints={type:"FeatureCollection",features};
  const pointSource=map.getSource("osm-water");if(pointSource)pointSource.setData(waterPoints);
  currentOrigin=[longitude,latitude];status.textContent=`${features.length} ongeverifieerde OSM-kandidaten gevonden binnen ${requestedRadiusKm} km. VASKOR toont mogelijke nabijheidsrelaties apart van vastgelegde relaties.`;
 }catch(error){
  if(request!==waterRequest)return;
  status.textContent=error.name==="AbortError"?"De OpenStreetMap-zoekopdracht duurde te lang op beide servers. Probeer het later opnieuw.":error.message?.startsWith("overpass-")?`OpenStreetMap is tijdelijk niet beschikbaar (HTTP ${error.message.slice(9)}). Probeer het later opnieuw.`:"De OpenStreetMap-gegevens konden niet worden opgehaald. Controleer je verbinding en probeer het opnieuw.";
 }finally{if(waterRequest===request)waterRequest=null;}
}
function showOsmPopup(feature,ml){
 const props=feature.properties,tags=props.tags||{},content=document.createElement("div");content.className="osm-popup";
 const category=props.category||"water",label=categoryLabel(category);
 const title=document.createElement("h2");title.textContent=tags.name||tags["name:en"]||`${label} (OSM)`;content.append(title);
 const note=document.createElement("p");note.textContent=`OpenStreetMap · ${props.osmType} ${props.osmId} · versie ${props.version??"onbekend"}${props.timestamp?` · OSM-bewerking ${props.timestamp}`:""} · ongetoetste brondata`;content.append(note);
 const identity=document.createElement("p");identity.textContent=`VASKOR-identiteit: ${props.vaskorId} · bronidentiteit: ${props.osmSourceId}`;content.append(identity);
 const relations=relationsForFeature(feature,waterPoints.features,pilotData);
 const relationPanel=document.createElement("section");relationPanel.className="relation-panel";
 const recordedHeading=document.createElement("h3");recordedHeading.textContent="Vastgelegde relaties";relationPanel.append(recordedHeading);
 const recordedList=document.createElement("ul");(relations.recorded.length?relations.recorded:[{label:"Geen vastgelegde relatie voor dit object"}]).forEach(relation=>{const item=document.createElement("li");item.textContent=relation.predicate?`${relation.predicate} → ${relation.label}`:relation.label;recordedList.append(item)});relationPanel.append(recordedList);
 const candidateHeading=document.createElement("h3");candidateHeading.textContent="Afgeleide kandidaatverbindingen · nabij binnen 500 m";relationPanel.append(candidateHeading);
 const candidateList=document.createElement("ul");(relations.candidates.length?relations.candidates:[{label:"Geen nabijgelegen kandidaten in deze zoekresultaten"}]).forEach(relation=>{const item=document.createElement("li");item.textContent=relation.distanceMeters!==undefined?`${relation.label} · ${relation.distanceMeters} m · kandidaat, niet bevestigd`:relation.label;candidateList.append(item)});relationPanel.append(candidateList);content.append(relationPanel);
 const list=document.createElement("dl");Object.entries(tags).sort(([a],[b])=>a.localeCompare(b)).forEach(([key,value])=>{const term=document.createElement("dt"),description=document.createElement("dd");term.textContent=key;description.textContent=value;list.append(term,description)});content.append(list);
 const link=document.createElement("a");link.href=`https://www.openstreetmap.org/${encodeURIComponent(props.osmType)}/${props.osmId}`;link.target="_blank";link.rel="noopener noreferrer";link.textContent="Bekijk bronobject";content.append(link);
 const capture=document.createElement("button");capture.type="button";capture.className="capture";capture.textContent="Ik zie deze voorziening ter plaatse";capture.addEventListener("click",()=>{
  if(!navigator.geolocation){status.textContent="Locatietoegang is nodig om een veldwaarneming vast te leggen.";return}
  capture.disabled=true;capture.textContent="Telefoonlocatie controleren…";
  navigator.geolocation.getCurrentPosition(({coords})=>{
   const stamp=new Date().toISOString(),phoneLocation=[coords.longitude,coords.latitude],offset=distanceMeters(feature.geometry.coordinates,phoneLocation);
   let nextPilotData;
   try{nextPilotData=saveFieldObservation(pilotData,{category,osmType:props.osmType,osmId:props.osmId,name:tags.name||tags["name:en"]||label,coordinates:feature.geometry.coordinates,observationLocation:phoneLocation,accuracyMeters:Math.round(coords.accuracy),distanceMeters:offset,observedAt:stamp,createId:()=>crypto.randomUUID()},localStorage)}catch{status.textContent="De telefoon kon de waarneming niet lokaal bewaren. Exporteer minder waarnemingen of probeer opnieuw.";capture.disabled=false;capture.textContent="Probeer opnieuw";return}
   pilotData=nextPilotData;
   updateExportLabel();capture.textContent="Waarneming toegevoegd op deze telefoon";
   status.textContent=`Veldwaarneming lokaal opgeslagen. Je telefoon was ${offset} m van de OSM-locatie (GPS-nauwkeurigheid ±${Math.round(coords.accuracy)} m). Dit bevestigt alleen wat je zelf hebt waargenomen; andere eigenschappen blijven onbevestigd.`;
  },error=>{capture.disabled=false;capture.textContent="Ik zie deze voorziening ter plaatse";status.textContent=error.code===1?"Locatietoegang geweigerd; er is geen waarneming vastgelegd.":"Telefoonlocatie niet beschikbaar; probeer opnieuw."},{enableHighAccuracy:true,timeout:20000,maximumAge:0});
 });content.append(capture);
 new ml.Popup({maxWidth:"none"}).setLngLat(feature.geometry.coordinates).setDOMContent(content).addTo(map);
}
exportButton.addEventListener("click",()=>{
 const blob=new Blob([JSON.stringify(pilotData,null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),link=document.createElement("a");link.href=url;link.download=`vaskor-field-pilot-${new Date().toISOString().slice(0,10)}.json`;link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
 if(!pilotData.knowledge_objects.length)status.textContent="Nog geen veldwaarnemingen. Tik een OSM-kandidaat aan en bevestig alleen wat je ter plaatse zelf ziet.";
});
try{
 const ml=await import("https://unpkg.com/maplibre-gl@6.16.0/dist/maplibre-gl.mjs");
 map=new ml.Map({container:"map",style:"https://tiles.openfreemap.org/styles/positron",center:[5.3,52.1],zoom:7,minZoom:3,maxZoom:18,cooperativeGestures:true});
 let marker,searchArea=emptyGeoJson;
 map.once("load",()=>{
  map.addSource("search-boundary",{type:"geojson",data:searchArea});
  map.addLayer({id:"search-boundary-fill",type:"fill",source:"search-boundary",paint:{"fill-color":"#2c8a72","fill-opacity":0.08}});
  map.addLayer({id:"search-boundary-line",type:"line",source:"search-boundary",paint:{"line-color":"#176452","line-width":2,"line-dasharray":[2,1.5]}});
  map.addSource("osm-water",{type:"geojson",data:waterPoints});
  map.addLayer({id:"osm-water-points",type:"circle",source:"osm-water",paint:{"circle-radius":["interpolate",["linear"],["zoom"],5,4,12,7],"circle-color":["match",["get","category"],"toilet","#7865b2","shower","#3986a6","swimming","#358f9a","#d28735"],"circle-stroke-color":"#fff","circle-stroke-width":1.5}});
  map.on("click","osm-water-points",event=>{const feature=event.features?.[0];if(feature)showOsmPopup(feature,ml)});
  map.on("mouseenter","osm-water-points",()=>{map.getCanvas().style.cursor="pointer"});map.on("mouseleave","osm-water-points",()=>{map.getCanvas().style.cursor=""});
  status.textContent="Kaart klaar. Kies een zoekstraal van 20 of 50 km en zoek voorzieningen wanneer je dat wilt.";
 });
 map.on("error",()=>{status.textContent="Kaartgegevens zijn niet volledig beschikbaar. Controleer je verbinding; je kunt de pagina later opnieuw proberen."});
 const updatePosition=({coords})=>{
   const point=[coords.longitude,coords.latitude];
   if(!Number.isFinite(point[0])||!Number.isFinite(point[1])||point[0]<-180||point[0]>180||point[1]<-90||point[1]>90)return;
   if(!marker)marker=new ml.Marker({color:"#23473e"}).setLngLat(point).addTo(map);else marker.setLngLat(point);
   map.easeTo({center:point,zoom:map.getZoom(),duration:500});
   currentOrigin=point;updateBoundary();
 };
 button.addEventListener("click",()=>{
  if(followWatchId!==null){navigator.geolocation.clearWatch(followWatchId);followWatchId=null;button.textContent="Mijn locatie";status.textContent="GPS-volgen gestopt. De kaart navigeert niet.";return}
  if(!navigator.geolocation){status.textContent="Locatiebepaling is niet beschikbaar in deze browser.";return}
  button.disabled=true;status.textContent="Locatietoestemming wordt gevraagd…";
  navigator.geolocation.getCurrentPosition(({coords})=>{
   const point=[coords.longitude,coords.latitude];
   if(!Number.isFinite(point[0])||!Number.isFinite(point[1])||point[0]<-180||point[0]>180||point[1]<-90||point[1]>90){
    status.textContent="Je locatie kon niet worden bepaald. Controleer de locatievoorzieningen en probeer opnieuw.";button.disabled=false;return;
   }
   updatePosition({coords});
   currentOrigin=point;updateBoundary();
   map.easeTo({center:point,zoom:7,duration:800});
   followWatchId=navigator.geolocation.watchPosition(updatePosition,error=>{
    if(followWatchId!==null)navigator.geolocation.clearWatch(followWatchId);
    followWatchId=null;button.textContent="Mijn locatie";button.disabled=false;
    status.textContent=error.code===1?"Toegang tot GPS-volgen geweigerd. De kaart blijft bruikbaar.":"GPS-volgen is tijdelijk niet beschikbaar. De kaart blijft bruikbaar.";
   },{enableHighAccuracy:true,timeout:20000,maximumAge:0});
   button.textContent="Stop volgen";button.disabled=false;status.textContent="GPS-volgen gestart. Tik nogmaals om te stoppen. Er is geen navigatie gestart.";
  },error=>{
   status.textContent=({1:"Geen toegang tot je locatie. De kaart blijft bruikbaar.",2:"Je locatie kon niet worden bepaald. Controleer de locatievoorzieningen en probeer opnieuw.",3:"Locatie bepalen duurde te lang. Probeer opnieuw."})[error.code]||"Locatiebepaling is niet gelukt. De kaart blijft bruikbaar.";
   button.disabled=false;
 },{enableHighAccuracy:true,timeout:20000,maximumAge:0});
 });
 searchButton.addEventListener("click",()=>{
  if(!navigator.geolocation){status.textContent="Locatiebepaling is niet beschikbaar. Zoeken vereist je actuele GPS-locatie; er is geen zoekactie uitgevoerd.";return}
  searchButton.disabled=true;status.textContent="Actuele GPS-locatie wordt opgevraagd voor de zoekactie…";
  navigator.geolocation.getCurrentPosition(({coords})=>{
   const point=[coords.longitude,coords.latitude];
   if(!Number.isFinite(point[0])||!Number.isFinite(point[1])||point[0]<-180||point[0]>180||point[1]<-90||point[1]>90){status.textContent="Je actuele locatie kon niet worden bepaald. Er is niet gezocht; probeer opnieuw.";searchButton.disabled=false;return}
   if(!marker)marker=new ml.Marker({color:"#23473e"}).setLngLat(point).addTo(map);else marker.setLngLat(point);
   currentOrigin=point;updateBoundary();
   map.easeTo({center:point,zoom:7,duration:800});
   findWaterPoints(point[0],point[1]).finally(()=>{searchButton.disabled=false});
  },error=>{
   status.textContent=({1:"Geen toegang tot je actuele locatie. Er is niet gezocht.",2:"Je actuele locatie kon niet worden bepaald. Er is niet gezocht; controleer je locatievoorzieningen.",3:"Actuele locatie bepalen duurde te lang. Er is niet gezocht; probeer opnieuw."})[error.code]||"Locatiebepaling is niet gelukt. Er is niet gezocht.";
   searchButton.disabled=false;
  },{enableHighAccuracy:true,timeout:60000,maximumAge:0});
 });
}catch{
 status.textContent="De kaartmodule kon niet worden geladen. Controleer je verbinding; je locatie is niet opgevraagd.";
 button.addEventListener("click",()=>{status.textContent="De kaart is niet beschikbaar. Probeer de pagina opnieuw wanneer je verbinding hebt."});
 searchButton.addEventListener("click",()=>{status.textContent="De kaart is niet beschikbaar. Probeer de pagina opnieuw wanneer je verbinding hebt."});
}
</script>
</body>
</html>
